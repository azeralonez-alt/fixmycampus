<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pengaduan</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Dashboard Pengaduan Fasilitas Kampus</h1>
        <p class="link-form"><a href="form_pengaduan.html">+ Buat pengaduan baru</a></p>

        <div class="ringkasan">
            <div class="kotak">
                <p>Total</p>
                <h2 id="total">0</h2>
            </div>
            <div class="kotak">
                <p>Menunggu</p>
                <h2 id="menunggu">0</h2>
            </div>
            <div class="kotak">
                <p>Diproses</p>
                <h2 id="diproses">0</h2>
            </div>
            <div class="kotak">
                <p>Selesai</p>
                <h2 id="selesai">0</h2>
            </div>
        </div>

        <div class="card">
            <h3>Daftar Pengaduan</h3>

            <div class="filter">
                <input type="text" id="cari" placeholder="Cari nama, lokasi, atau deskripsi ...">
                <select id="filterStatus">
                    <option value="">Semua Status</option>
                    <option value="Menunggu">Menunggu</option>
                    <option value="Diproses">Diproses</option>
                    <option value="Selesai">Selesai</option>
                </select>
            </div>

            <div class="tabel-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Tanggal</th>
                            <th>Pelapor</th>
                            <th>Lokasi</th>
                            <th>Kategori</th>
                            <th>Deskripsi</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="isiTabel"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
